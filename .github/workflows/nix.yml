name: nix

on:
  push:
    branches: [main, staging, trying]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix fmt -- --ci

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
      - name: Select the locked private source
        id: llm-source
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          source = json.loads(Path('flake.lock').read_text())['nodes']['llm-ms']['locked']
          assert source['owner'] == 'Bootstrap-Academy' and source['repo'] == 'llm-ms'
          print('revision=' + source['rev'])
          PY
      - uses: actions/checkout@v5
        with:
          repository: Bootstrap-Academy/llm-ms
          ref: ${{ steps.llm-source.outputs.revision }}
          path: .private-inputs/llm-ms
          fetch-depth: 0
          ssh-key: ${{ secrets.LLM_MS_SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.bootstrap.academy/
          cache: infrastructure
          # atticd-atticadm make-token --sub github --validity 1y --pull infrastructure --push infrastructure
          token: ${{ secrets.ATTIC_TOKEN }}
      - run: |
          echo >> ~/.config/nix/nix.conf
          echo extra-substituters = https://bootstrap-academy.cachix.org https://attic.defelo.de/sandkasten https://cache.bootstrap.academy/academy >> ~/.config/nix/nix.conf
          echo extra-trusted-public-keys = bootstrap-academy.cachix.org-1:QoTxaO9Xw868/oefU7MrrkzrbFH9sUCJwWbIqsLCjxs= sandkasten:U7kShJt9A6tZr4pZRAXHmRlxC3nmOGvfviPqKL7hROE= academy:JU67oyd32Kzh7XFkUD/rZ6I3wVT8xMtgghwBvEINGus= >> ~/.config/nix/nix.conf
      - name: Build the exact locked sources
        env:
          LLM_SOURCE_REVISION: ${{ steps.llm-source.outputs.revision }}
        run: |
          set -euo pipefail
          nix build -L --keep-going .#checks --no-write-lock-file \
            --override-input llm-ms "git+file://$GITHUB_WORKSPACE/.private-inputs/llm-ms?rev=$LLM_SOURCE_REVISION"
